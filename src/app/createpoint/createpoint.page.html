<ion-header [translucent]="true">
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/maps"></ion-back-button>
    </ion-buttons>

    <ion-title>createpoint</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-item>
    <ion-label position="floating">Name</ion-label>
    <ion-input [(ngModel)]="name"></ion-input>
  </ion-item>

<!-- Letakkan setelah field Name dan sebelum Coordinates -->
<ion-item>
  <ion-textarea
    label="Description"
    labelPlacement="stacked"
    autoGrow="true">
  </ion-textarea>
</ion-item>

<!-- ...existing code... -->

  <ion-item>
    <ion-label position="floating">Coordinates</ion-label>
    <ion-input [(ngModel)]="coordinates"></ion-input>
  </ion-item>

  <!-- Peta untuk memilih titik -->
  <div id="mapcreate" style="height: 400px;"></div>

  <ion-button expand="full" (click)="save()">
    Save
  </ion-button>

</ion-content>
